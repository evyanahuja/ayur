# =============================================================================
#  Netlify configuration
# -----------------------------------------------------------------------------
#  Netlify auto-detects Next.js and installs the official runtime adapter
#  (@netlify/plugin-nextjs) for you — SSR, API routes and the enquiry form
#  all work out of the box. Do NOT pin the plugin version; Netlify keeps it
#  updated automatically on every build.
# =============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-cache static images (safe: filenames are stable, redeploy busts HTML)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
