# =============================================================================
#  Netlify configuration
# -----------------------------------------------------------------------------
#  Netlify auto-detects Next.js and installs the official runtime adapter
#  (@netlify/plugin-nextjs) for you — SSR, API routes and the enquiry form
#  all work out of the box. Do NOT pin the plugin version; Netlify keeps it
#  updated automatically on every build.
# =============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Security headers. The page relies on Next.js hydration and a JSON-LD block,
# hence the narrowly scoped inline script/style allowances. All external script,
# object, frame and connection sources remain blocked.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.pexels.com; font-src 'self' data:; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Long-cache static images (safe: filenames are stable, redeploy busts HTML)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
